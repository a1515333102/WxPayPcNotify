name: Build WxPayPcNotify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "weixin.ico")) {
            throw "缺少图标文件 weixin.ico"
          }
          pyinstaller --noconfirm --clean --onefile --console `
            --name WxPayPcNotify `
            --icon=weixin.ico `
            --collect-all rapidocr_onnxruntime `
            --collect-all onnxruntime `
            --collect-all comtypes `
            --hidden-import=win32timezone `
            --hidden-import=pythoncom `
            --hidden-import=pywintypes `
            .\WxPayPcNotify.py
          if (-not (Test-Path "dist\WxPayPcNotify.exe")) {
            throw "未生成 dist\WxPayPcNotify.exe"
          }
          Get-Item "dist\WxPayPcNotify.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WxPayPcNotify-windows
          path: dist/WxPayPcNotify.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WxPayPcNotify.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
